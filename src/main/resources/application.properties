spring.application.name=ninjas

server.port=8080

# 1. Added missing double slash '//' after 'postgresql:'
spring.datasource.url=jdbc:postgresql://localhost:5432/ninjas

spring.datasource.username=postgres
spring.datasource.password=1234

# 2. Fixed spelling: changed 'drive-class-name' to 'driver-class-name'
# and 'postgreql' to 'postgresql'
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Fixed comma ',' to dot '.' and fixed spelling of 'database-platform'
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect